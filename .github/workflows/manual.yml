# RaceDay CI – builds the solution and MVC Docker image
name: RaceDay CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build:
    name: Build solution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Find RaceDay.sln in case the repo root is a parent folder
      - name: Locate solution
        id: find
        run: |
          SLN=$(find . -name "RaceDay.sln" -type f | head -n 1)
          if [ -z "$SLN" ]; then
            echo "RaceDay.sln not found"
            find . -maxdepth 3 -type f -name "*.sln" -o -name "*.csproj"
            exit 1
          fi
          DIR=$(dirname "$SLN")
          echo "solution=$SLN" >> $GITHUB_OUTPUT
          echo "workdir=$DIR" >> $GITHUB_OUTPUT
          echo "Found solution at $SLN"

      - name: Restore dependencies
        working-directory: ${{ steps.find.outputs.workdir }}
        run: dotnet restore RaceDay.sln

      - name: Build
        working-directory: ${{ steps.find.outputs.workdir }}
        run: dotnet build RaceDay.sln --configuration ${{ inputs.configuration || 'Release' }} --no-restore

      - name: Publish API
        working-directory: ${{ steps.find.outputs.workdir }}
        run: |
          dotnet publish RaceDay.Api/RaceDay.Api.csproj \
            --configuration ${{ inputs.configuration || 'Release' }} \
            --no-build \
            --output ./publish/api

      - name: Publish MVC
        working-directory: ${{ steps.find.outputs.workdir }}
        run: |
          dotnet publish RaceDay.Mvc/RaceDay.Mvc.csproj \
            --configuration ${{ inputs.configuration || 'Release' }} \
            --no-build \
            --output ./publish/mvc

      - name: Upload publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: raceday-publish
          path: ${{ steps.find.outputs.workdir }}/publish
          retention-days: 7

  docker:
    name: Build Docker image
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate solution root
        id: find
        run: |
          SLN=$(find . -name "RaceDay.sln" -type f | head -n 1)
          DIR=$(dirname "$SLN")
          echo "workdir=$DIR" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build MVC image
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.find.outputs.workdir }}
          file: ${{ steps.find.outputs.workdir }}/RaceDay.Mvc/Dockerfile
          push: false
          tags: raceday-mvc:latest

      - name: Verify image
        run: docker images raceday-mvc
